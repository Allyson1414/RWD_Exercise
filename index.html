<body>
    <h2>Please let us know which anime is your favorite using the form below!</h2>

    <section>
        <form>
            <fieldset>
                <legend>Anime Submission Form</legend>
                <label for="f_name">First Name:</label>
                <input type="text" id="f_name" name="f_name" required/>
                <br/>
                <label for="l_name">Last Name:</label>
                <input type="text" id="l_name" name="l_name" required/>
                <br/>
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" required/>
                <br/>
                <fieldset>
                    <legend>What is your favorite anime from the choices below?</legend>
                    <input type="checkbox" id="Pokemon" name="pokemon" value="Pokemon"/>
                    <label for="pokemon">Pokemon</label>
                    <input type="checkbox" id="idol_precure" name="idol precure" value="Idol Precure"/>
                    <label for="idol_precure">You and Idol Precure</label>
                    <input type="checkbox" id="Sailormoon" name="sailormoon" value="Sailor Moon"/>
                    <label for="sailormoon">Sailor Moon</label>
                    <input type="checkbox" id="yamadakun" name="yamadakun" value="Yamadakun"/>
                    <label for="yamadakun">My Love Story with Yamada-Kun at level 999</label>
                    <br/>
                </fieldset>
                <input type="submit" value="Submit"/>
            </fieldset>
        </form>
        <img id="pokemon" src="Media/pikaandsylveon.jpg" alt="Pokemon">
        <figcaption>Pokemon</figcaption>
    </section>
